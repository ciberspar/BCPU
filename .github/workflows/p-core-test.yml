name: BCPU Tomato G1 - Hardware Tests

on:
  push:
    paths:
      - "tomato-g1/rtl/**"
      - ".github/workflows/p-core-test.yml"

  pull_request:
    paths:
      - "tomato-g1/rtl/**"
      - ".github/workflows/p-core-test.yml"

  workflow_dispatch:

jobs:
  hardware-tests:
    name: Tomato G1 RTL Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Test ALU
        run: |
          mkdir -p build

          iverilog -g2012 -Wall \
            -s alu_tb \
            -o build/alu_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/alu_tb.v

          vvp build/alu_tb.vvp

      - name: Test P-Core
        run: |
          iverilog -g2012 -Wall \
            -s p_core_tb \
            -o build/p_core_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/registers.v \
            tomato-g1/rtl/p_core.v \
            tomato-g1/rtl/p_core_tb.v

          vvp build/p_core_tb.vvp