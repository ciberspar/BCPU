
name: BCPU Tomato G1 - RTL Tests

on:
  push:
    branches:
      - main
      - pruebas
  pull_request:
    branches:
      - main
      - pruebas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-tests:
    name: Tomato G1 Hardware Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc

      - name: Create Build Directory
        run: mkdir -p build

      # ALU
      - name: Test ALU
        run: |
          iverilog -g2012 -Wall \
            -s alu_tb \
            -o build/alu_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/alu_tb.v
          vvp build/alu_tb.vvp

      # REGISTERS
      - name: Test Registers
        run: |
          iverilog -g2012 -Wall \
            -s registers_tb \
            -o build/registers_tb.vvp \
            tomato-g1/rtl/registers.v \
            tomato-g1/rtl/registers_tb.v
          vvp build/registers_tb.vvp

      # CONTROL UNIT
      - name: Test Control Unit
        run: |
          iverilog -g2012 -Wall \
            -s control_unit_tb \
            -o build/control_unit_tb.vvp \
            tomato-g1/rtl/control_unit.v \
            tomato-g1/rtl/control_unit_tb.v
          vvp build/control_unit_tb.vvp

      # MEMORY CONTROLLER
      - name: Test Memory Controller
        run: |
          iverilog -g2012 -Wall \
            -s memory_controller_tb \
            -o build/memory_controller_tb.vvp \
            tomato-g1/rtl/memory_controller.v \
            tomato-g1/rtl/memory_controller_tb.v
          vvp build/memory_controller_tb.vvp

      # P-CORE
      - name: Test P-Core
        run: |
          iverilog -g2012 -Wall \
            -s p_core_tb \
            -o build/p_core_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/registers.v \
            tomato-g1/rtl/control_unit.v \
            tomato-g1/rtl/p_core.v \
            tomato-g1/rtl/p_core_tb.v
          vvp build/p_core_tb.vvp

      # E-CORE
      - name: Test E-Core
        run: |
          iverilog -g2012 -Wall \
            -s e_core_tb \
            -o build/e_core_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/registers.v \
            tomato-g1/rtl/control_unit.v \
            tomato-g1/rtl/e_core.v \
            tomato-g1/rtl/e_core_tb.v
          vvp build/e_core_tb.vvp

      # CORE SCHEDULER
      - name: Test Core Scheduler
        run: |
          iverilog -g2012 -Wall \
            -s core_scheduler_tb \
            -o build/core_scheduler_tb.vvp \
            tomato-g1/rtl/core_scheduler.v \
            tomato-g1/rtl/core_scheduler_tb.v
          vvp build/core_scheduler_tb.vvp

      # CORE SCHEDULER STRESS
      - name: Test Core Scheduler Stress
        run: |
          iverilog -g2012 -Wall \
            -s core_scheduler_stress_tb \
            -o build/core_scheduler_stress_tb.vvp \
            tomato-g1/rtl/core_scheduler.v \
            tomato-g1/rtl/core_scheduler_stress_tb.v
          vvp build/core_scheduler_stress_tb.vvp

      # CORE SCHEDULER CONTENTION
      - name: Test Core Scheduler Contention
        run: |
          iverilog -g2012 -Wall \
            -s core_scheduler_contention_tb \
            -o build/core_scheduler_contention_tb.vvp \
            tomato-g1/rtl/core_scheduler.v \
            tomato-g1/rtl/core_scheduler_contention_tb.v

          vvp build/core_scheduler_contention_tb.vvp | tee build/contention.log

          grep -q "ALL CONTENTION TESTS PASSED!" build/contention.log

      # INTEGRATED TOMATO G1 SYSTEM
      - name: Test Tomato G1 Integrated System
        run: |
          iverilog -g2012 -Wall \
            -s tomato_g1_top_tb \
            -o build/tomato_g1_top_tb.vvp \
            tomato-g1/rtl/alu.v \
            tomato-g1/rtl/registers.v \
            tomato-g1/rtl/control_unit.v \
            tomato-g1/rtl/p_core.v \
            tomato-g1/rtl/e_core.v \
            tomato-g1/rtl/core_scheduler.v \
            tomato-g1/rtl/tomato_g1_top.v \
            tomato-g1/rtl/tomato_g1_top_tb.v
          vvp build/tomato_g1_top_tb.vvp

      # LETTUCE32 EMULATOR
      - name: Build Lettuce32 Emulator Tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DLETTUCE_EMULATOR_NO_MAIN \
            -Wno-unused-function \
            -o build/lettuce_emulator_tb \
            tomato-g1/software/lettuce_emulator_tb.c \
            tomato-g1/software/lettuce_emulator.c

      - name: Run Lettuce32 Emulator Tests
        run: |
          set -o pipefail
          ./build/lettuce_emulator_tb | tee build/lettuce_emulator.log

          grep -q "Failed: 0" \
            build/lettuce_emulator.log

      # LETTUCE32 ASSEMBLER TESTS
      - name: Build Lettuce32 Assembler Tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -I tomato-g1/software/assembler \
            tomato-g1/software/assembler/assembler_tb.c \
            -o build/lettuce_assembler_tb

      - name: Run Lettuce32 Assembler Tests
        run: |
          ./build/lettuce_assembler_tb | tee build/lettuce_assembler.log

          grep -q "ALL LETTUCE32 ASSEMBLER TESTS PASSED!" \
            build/lettuce_assembler.log

      # LETTUCE32 ASSEMBLER CLI
      - name: Build Lettuce32 Assembler CLI
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -I tomato-g1/software/assembler \
            tomato-g1/software/assembler/lettuce_assembler.c \
            -o build/lettuce_assembler

      - name: Test Lettuce32 Assembler CLI
        run: |
          printf '%s\n' \
            'ADDI R1, R0, 10' \
            'ADDI R2, R0, 20' \
            'ADD R3, R1, R2' \
            'HALT' \
            | ./build/lettuce_assembler > build/assembler_output.txt

          diff -u <(printf '%s\n' \
            '3040000A' \
            '30800014' \
            '04C48000' \
            '7C000000') \
            build/assembler_output.txt

      # FINAL VERIFICATION
      - name: Verification Complete
        run: |
          echo "=================================="
          echo " BCPU TOMATO G1"
          echo " VERIFICATION COMPLETED"
          echo "=================================="
          echo "ALU: PASSED"
          echo "REGISTERS: PASSED"
          echo "CONTROL UNIT: PASSED"
          echo "MEMORY CONTROLLER: PASSED"
          echo "P-CORE: PASSED"
          echo "E-CORE: PASSED"
          echo "CORE SCHEDULER: PASSED"
          echo "SCHEDULER STRESS: PASSED"
          echo "SCHEDULER CONTENTION: PASSED"
          echo "INTEGRATED SYSTEM: PASSED"
          echo "LETTUCE32 EMULATOR: PASSED"
          echo "LETTUCE32 ASSEMBLER: PASSED"
          echo "ASSEMBLER CLI: PASSED"
          echo "=================================="
